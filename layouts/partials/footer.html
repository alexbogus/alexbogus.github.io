{{ $social := hugo.Data.social }}
<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-meta">&copy; {{ now.Year }} {{ .Site.Params.author }}</p>
    <nav class="footer-links" aria-label="Enlaces de contacto">
      <a href="{{ "/contacto/" | relURL }}">Contacto</a>
      <a href="{{ $social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ $social.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ $social.x }}" target="_blank" rel="noopener">X</a>
      <a href="{{ "/contacto/" | relURL }}">Escríbeme</a>
    </nav>
  </div>
</footer>
