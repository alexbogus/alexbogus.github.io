{{ define "main" }}
{{ $social := hugo.Data.social }}
<section class="section">
  <div class="container">
    <h1 class="section-title">{{ .Title }}</h1>
    <div class="contact-grid">
      <div class="contact-info">
        {{ .Content }}
        <div class="contact-links">
          <a href="{{ $social.linkedin }}" target="_blank" rel="noopener" class="contact-btn">{{ partial "social-icon.html" "linkedin" }}LinkedIn</a>
          <a href="{{ $social.github }}" target="_blank" rel="noopener" class="contact-btn">{{ partial "social-icon.html" "github" }}GitHub</a>
          <a href="{{ $social.x }}" target="_blank" rel="noopener" class="contact-btn">{{ partial "social-icon.html" "x" }}X</a>
        </div>
        <p class="footer-meta">{{ $social.location }}</p>
      </div>

      <div class="contact-form-col">
        <h2 class="section-title">Envíame un mensaje</h2>
        <form id="contact-form" class="contact-form" action="https://formspree.io/f/xjybyzrb" method="POST">
          <label for="contact-name">Nombre</label>
          <input type="text" id="contact-name" name="name" required>
          <label for="contact-email">Tu email</label>
          <input type="email" id="contact-email" name="email" required>
          <label for="contact-message">Mensaje</label>
          <textarea id="contact-message" name="message" rows="5" required></textarea>
          <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
          <button type="submit" class="btn">Enviar mensaje</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</section>
{{ end }}
