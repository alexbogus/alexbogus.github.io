{{ define "main" }}
<section class="section">
  <div class="container">
    <h1 class="section-title">{{ .Title }}</h1>
    {{ $pages := .Pages }}
    {{ if $pages }}
    <div class="explore-grid">
      {{ range $pages }}
      <a class="explore-card" href="{{ .RelPermalink }}">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
        {{ with .Params.tags }}
        <div class="job-tags">{{ range . }}<span>{{ . }}</span>{{ end }}</div>
        {{ end }}
      </a>
      {{ end }}
    </div>
    {{ else }}
    <p class="empty-state">Próximamente: iniciativas y proyectos destacados.</p>
    {{ end }}
  </div>
</section>
{{ end }}
