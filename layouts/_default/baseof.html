<!DOCTYPE html>
<html lang="es">
<head>
  {{ partial "head.html" . }}
  {{ partial "schema.html" . }}
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  {{ partial "header.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $script := resources.Get "js/site.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $script.RelPermalink }}" defer></script>
</body>
</html>
